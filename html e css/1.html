<!doctype html>
<head>
    <title>1</title>
    <style>
        body{
            display:flex;
            justify-content: center;
            align-items: center;
            margin-top: 25%;
        }
        #japao{
            width: 180px;
            height: 120px;
            background-color: white;
            border: 1px solid black;
            position:relative;
            top:50%
        }
        #bola{
            background-color: red;
            position: absolute;
            width: 50px;
            height: 50px;
            top: 50%;
            left:50%;
            transform:translate(-50%,-50%);
            border-radius: 50%;
        }
        #bandeiraF{
            position:relative;
            width: 180px;
            height: 120px;
            border: 1px solid black;
            top:50%;
            margin-left: 10px;
        }
        #vermelho{
            position: absolute;
            top:0px;
            width: 100%;
            height: 33%;
            background-color: red;
        }
        #branco{
            position: absolute;
            top:33%;
            width: 100%;
            height: 33%;
            background-color: white;
        }
        #azul{
            position: absolute;
            top:66%;
            width: 100%;
            height: 33%;
            background-color: blue;
        }
        #bandeiraI{
            position: relative;
            width: 180px;
            height: 120px;
            border: 1px solid black;
            top:50%;
            margin-left: 10px;
        }
        #verde{
            position: absolute;
            background-color: green;
            width: 33%;
            height: 100%;

        }
        #branco1{
            position: absolute;
            background-color: white;
            left: 33%;
            width: 66%;
            height: 100%;
            
        }
         #vermelho1{
            position: absolute;
            background-color: red;
            left: 66%;
            width: 33%;
            height: 100%;
            
        }

    </style>
</head>
<body>

<div id="japao">
    <div id="bola"></div>
</div>
<div id="bandeiraF">
    <div id="vermelho"></div>
    <div id="branco"></div>
    <div id="azul"></div>
</div>
<div id="bandeiraI">
    <div id="verde"></div>
    <div id="branco1"></div>
    <div id="vermelho1"></div>
</div>

</body>
</html>
