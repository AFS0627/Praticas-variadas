<!DOCTYPE html>
<head>
    <title>2</title>
    <style>
        div{
            position:absolute;
height: 100px;
            width: 100px;
            border-radius: 50%;
        }
        #div1{
           
            top:0px;
            left: 0px;
            background-color: red;
            
        }
        #div2{
           
            top:0px;
            right: 0px;
            background-color: cadetblue;
            
        }
        #div3{
           
            bottom:0px;
            left: 0px;
            background-color: greenyellow;
            
        }
        #div4{
           
            bottom:0px;
            right: 0px;
            background-color: yellow;
            
        }
        #div5{
           
            top:50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: purple;
            
        }
    </style>
</head>

<body>
<div id="div1"></div>
<div id="div2"></div>
<div id="div3"></div>
<div id="div4"></div>
<div id="div5"></div>


</body>
</html>
